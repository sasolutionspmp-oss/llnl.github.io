 (cd "$(git rev-parse --show-toplevel)" && git apply --3way <<'EOF' 
diff --git a//dev/null b/.github/workflows/windows-installer.yml
index 0000000000000000000000000000000000000000..2bab7d0ef8aad4e14fbdb8f43e57afe8d7033b38 100644
--- a//dev/null
+++ b/.github/workflows/windows-installer.yml
@@ -0,0 +1,34 @@
+name: Windows Installer
+
+on:
+  push:
+    branches: [ main ]
+    paths:
+      - '.ci/trigger'
+      - 'build-exe.ps1'
+      - 'build-installer.ps1'
+      - 'SA-CMS-Pro.iss'
+      - 'branding/**'
+      - 'file_version_info.txt'
+      - '.github/workflows/windows-installer.yml'
+
+jobs:
+  build:
+    runs-on: windows-latest
+    steps:
+      - uses: actions/checkout@v3
+      - uses: actions/setup-python@v4
+        with:
+          python-version: '3.x'
+      - name: Install deps
+        run: |
+          python -m pip install --upgrade pip
+          pip install -r requirements.txt
+      - name: Build executable
+        run: pwsh -ExecutionPolicy Bypass -File .\build-exe.ps1 -Clean
+      - name: Build installer
+        run: pwsh -ExecutionPolicy Bypass -File .\build-installer.ps1
+      - uses: actions/upload-artifact@v3
+        with:
+          name: windows-dist
+          path: dist/*
 
EOF
)
